<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identificando la mano</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <script>
    //Paso 1 (objetos y variables)
    let handPose  //Acceder modelo ml5
    let video     //objeto que accede a la camara
    let hands = [] //Es un arreglo que contiene la informacion de las manos
    let connections   //Conexiones con la mano



    //Paso 2. - configuracion
    async function setup(){
      handPose = await ml5.handPose()


      createCanvas(640, 480) //Renderiza video + conexiones

      video = createCapture(VIDEO)  //Leer la informacion camara
      video.size(640, 480)
      video.hide() //Ocultamos el video por que sera renderizado en canvas


      //Iniciar la deteccion
      handPose.detectStart(video, gotHands)
      connections = handPose.getConnections()
    }

    //Paso 3 - Renderizado (dibujar)
    function draw(){
      //Pintar el video obtenido en el canvas
      image(video, 0, 0, width, height)


      //Identifica la(s) mano(s) y luego analiza sus conexiones
      for (let i = 0; i < hands.length; i++) {
        let hand = hands[i]

        //Recorrer el arreglo q7ue contiene todas las conexiones de una mano
        for (let j = 0; j < connections.length; j++){
          let pointAIndex = connections[j][0]
          let pointBIndex = connections[j][1]
          let pointA = hand.keypoints[pointAIndex]
          let pointB = hand.keypoints[pointBIndex]


          stroke(255,0,0)
          strokeWeight(2)
          line(pointA.x, pointA.y, pointB.x, pointB.y)
        }
      }

      //Renderizar los puntos
      for (let i = 0; i < hands.length; i++){
        let hand = hands[i]
        for (let j = 0; j < hand.keypoints.length; j++){
          let keypoint = hand.keypoints[j] //Contiene X - Y
          fill(0, 255, 0) //Color de relleno (verde)
          noStroke()
          circle(keypoint.x, keypoint.y, 10) //Ejex, Ejey, radio
        }
      }
    }

    function gotHands(results){
      //console.log(results)

      //El resultado obtenido por el modelo sera las manos
      hands = results
    }
  </script>
</body>
</html>
