<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>
  <div id="resultados"></div>
  <script>
    const resultados = document.querySelector('#resultados')

    let handPose
    let video
    let hands = []

    async function setup(){
      handPose = await ml5.handPose()

      createCanvas(640, 480)

      video = createCapture(VIDEO)
      video.size(640, 480)
      video.hide()
      handPose.detectStart(video, gotHands)
    }

    function draw(){
      image(video, 0, 0, width, height)

      if (hands.length >=2){
        let finger1 = hands[0].index_finger_tip
        let finger2 = hands[1].index_finger_tip


        let centerX = (finger1.x + finger2.x) / 2
        let centerY = (finger1.y + finger2.y) / 2


        distancia = dist(finger1.x, finger1.y, finger2.x, finger2.y)

        fill(0, 255, 0, 200)
        stroke(0)
        strokeWeight(2)
        circle(centerX, centerY, distancia);
      }
    }

    function gotHands(results){
      hands = results
    }
  </script>
  
</body>
</html>
